name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Create fresh Flutter template
        run: |
          flutter create . --org com.digiseller.app --project-name digiseller_app

      - name: Enable HTTP Cleartext Traffic in AndroidManifest
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="Цифровой Маркет"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:value="@style/ValueTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Overwrite pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: digiseller_app
          description: Digiseller Affiliate App
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            http: ^1.2.0
            url_launcher: ^6.2.5

          flutter:
            uses-material-design: true
          EOF

      - name: Overwrite main.dart with Debug & Fixes
        run: |
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:http/http.dart' as http;
          import 'dart:convert';
          import 'package:url_launcher/url_launcher.dart';

          void main() {
            runApp(const DigisellerApp());
          }

          class DigisellerApp extends StatelessWidget {
            const DigisellerApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Цифровой Маркет',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: Colors.deepPurple,
                    brightness: Brightness.dark,
                  ),
                  useMaterial3: true,
                ),
                home: const CatalogPage(),
              );
            }
          }

          class CatalogPage extends StatefulWidget {
            const CatalogPage({super.key});

            @override
            State<CatalogPage> createState() => _CatalogPageState();
          }

          class _CatalogPageState extends State<CatalogPage> {
            final String apiUrl = 'http://grummer565.temp.swtest.ru/index.php';

            List products = [];
            List categories = ['Все'];
            String selectedCategory = 'Все';
            bool isLoading = true;
            String errorMessage = '';

            @override
            void initState() {
              super.initState();
              loadData();
            }

            Future<void> loadData() async {
              setState(() {
                isLoading = true;
                errorMessage = '';
              });
              try {
                final response = await http.get(
                  Uri.parse(apiUrl),
                  headers: {
                    'User-Agent': 'Mozilla/5.0',
                    'Accept': 'application/json',
                  },
                );

                if (response.statusCode == 200) {
                  // декодируем корректно с поддержкой UTF-8
                  final String bodyString = utf8.decode(response.bodyBytes);
                  final decoded = json.decode(bodyString);

                  if (decoded is Map && decoded.containsKey('products')) {
                    setState(() {
                      products = decoded['products'] ?? [];
                      final rawCats = decoded['categories'] ?? [];
                      categories = ['Все', ...List<String>.from(rawCats)];
                      isLoading = false;
                    });
                  } else {
                    setState(() {
                      errorMessage = 'Неверная структура JSON:\n$bodyString';
                      isLoading = false;
                    });
                  }
                } else {
                  setState(() {
                    errorMessage = 'Ошибка сервера: HTTP ${response.statusCode}';
                    isLoading = false;
                  });
                }
              } catch (e) {
                setState(() {
                  errorMessage = 'Ошибка подключения:\n$e';
                  isLoading = false;
                });
              }
            }

            Future<void> openCheckout(String payUrl) async {
              final url = Uri.parse(payUrl);
              if (await canLaunchUrl(url)) {
                await launchUrl(url, mode: LaunchMode.externalApplication);
              }
            }

            @override
            Widget build(BuildContext context) {
              final filteredProducts = selectedCategory == 'Все'
                  ? products
                  : products.where((p) => p['category'] == selectedCategory).toList();

              return Scaffold(
                appBar: AppBar(
                  title: const Text('Цифровой Маркет'),
                  centerTitle: true,
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.refresh),
                      onPressed: loadData,
                    )
                  ],
                ),
                body: isLoading
                    ? const Center(child: CircularProgressIndicator())
                    : errorMessage.isNotEmpty
                        ? Padding(
                            padding: const EdgeInsets.all(16.0),
                            child: Center(
                              child: Column(
                                mainAxisAlignment: MainAxisAlignment.center,
                                children: [
                                  const Icon(Icons.error_outline, color: Colors.redAccent, size: 48),
                                  const SizedBox(height: 12),
                                  Text(
                                    errorMessage,
                                    textAlign: TextAlign.center,
                                    style: const TextStyle(color: Colors.redAccent, fontSize: 13),
                                  ),
                                  const SizedBox(height: 16),
                                  ElevatedButton(
                                    onPressed: loadData,
                                    child: const Text('Повторить'),
                                  )
                                ],
                              ),
                            ),
                          )
                        : Column(
                            children: [
                              if (categories.length > 1)
                                SizedBox(
                                  height: 50,
                                  child: ListView.builder(
                                    scrollDirection: Axis.horizontal,
                                    itemCount: categories.length,
                                    padding: const EdgeInsets.symmetric(horizontal: 8),
                                    itemBuilder: (context, index) {
                                      final cat = categories[index];
                                      final isSelected = cat == selectedCategory;
                                      return Padding(
                                        padding: const EdgeInsets.symmetric(horizontal: 4),
                                        child: ChoiceChip(
                                          label: Text(cat),
                                          selected: isSelected,
                                          onSelected: (selected) {
                                            if (selected) {
                                              setState(() => selectedCategory = cat);
                                            }
                                          },
                                        ),
                                      );
                                    },
                                  ),
                                ),
                              Expanded(
                                child: filteredProducts.isEmpty
                                    ? const Center(child: Text('Товаров в этой категории нет'))
                                    : ListView.builder(
                                        itemCount: filteredProducts.length,
                                        itemBuilder: (context, index) {
                                          final item = filteredProducts[index];
                                          final title = item['title'] ?? 'Без названия';
                                          final price = item['price'] ?? '0 RUB';
                                          final imgUrl = item['img_url'] ?? '';
                                          final category = item['category'] ?? '';

                                          return Card(
                                            margin: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                                            clipBehavior: Clip.antiAlias,
                                            child: InkWell(
                                              onTap: () {
                                                Navigator.push(
                                                  context,
                                                  MaterialPageRoute(
                                                    builder: (context) => ProductDetailPage(product: item),
                                                  ),
                                                );
                                              },
                                              child: Row(
                                                children: [
                                                  if (imgUrl.isNotEmpty)
                                                    Image.network(
                                                      imgUrl,
                                                      width: 90,
                                                      height: 90,
                                                      fit: BoxFit.cover,
                                                      errorBuilder: (ctx, err, stack) => const SizedBox(
                                                        width: 90,
                                                        height: 90,
                                                        child: Icon(Icons.image_not_supported),
                                                      ),
                                                    ),
                                                  Expanded(
                                                    child: Padding(
                                                      padding: const EdgeInsets.all(10.0),
                                                      child: Column(
                                                        crossAxisAlignment: CrossAxisAlignment.start,
                                                        children: [
                                                          Text(
                                                            category,
                                                            style: const TextStyle(
                                                              fontSize: 11,
                                                              color: Colors.deepPurpleAccent,
                                                              fontWeight: FontWeight.bold,
                                                            ),
                                                          ),
                                                          const SizedBox(height: 4),
                                                          Text(
                                                            title,
                                                            maxLines: 2,
                                                            overflow: TextOverflow.ellipsis,
                                                            style: const TextStyle(
                                                              fontWeight: FontWeight.bold,
                                                              fontSize: 13,
                                                            ),
                                                          ),
                                                          const SizedBox(height: 6),
                                                          Text(
                                                            price,
                                                            style: const TextStyle(
                                                              color: Colors.greenAccent,
                                                              fontWeight: FontWeight.bold,
                                                              fontSize: 14,
                                                            ),
                                                          ),
                                                        ],
                                                      ),
                                                    ),
                                                  ),
                                                  Padding(
                                                    padding: const EdgeInsets.only(right: 8.0),
                                                    child: ElevatedButton(
                                                      style: ElevatedButton.styleFrom(
                                                        backgroundColor: Colors.deepPurple,
                                                        foregroundColor: Colors.white,
                                                      ),
                                                      onPressed: () => openCheckout(item['pay_url']),
                                                      child: const Text('Купить'),
                                                    ),
                                                  ),
                                                ],
                                              ),
                                            ),
                                          );
                                        },
                                      ),
                              ),
                            ],
                          ),
              );
            }
          }

          class ProductDetailPage extends StatelessWidget {
            final Map product;

            const ProductDetailPage({super.key, required this.product});

            Future<void> openCheckout(String payUrl) async {
              final url = Uri.parse(payUrl);
              if (await canLaunchUrl(url)) {
                await launchUrl(url, mode: LaunchMode.externalApplication);
              }
            }

            @override
            Widget build(BuildContext context) {
              final title = product['title'] ?? 'Без названия';
              final price = product['price'] ?? '0 RUB';
              final imgUrl = product['img_url'] ?? '';
              final description = product['description'] ?? 'Описание отсутствует';
              final reviews = (product['reviews'] as List?) ?? [];

              return Scaffold(
                appBar: AppBar(
                  title: Text(title, maxLines: 1, overflow: TextOverflow.ellipsis),
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(16.0),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      if (imgUrl.isNotEmpty)
                        ClipRRect(
                          borderRadius: BorderRadius.circular(12),
                          child: Image.network(
                            imgUrl,
                            width: double.infinity,
                            height: 200,
                            fit: BoxFit.cover,
                            errorBuilder: (ctx, err, stack) => const SizedBox(),
                          ),
                        ),
                      const SizedBox(height: 16),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          Text(
                            price,
                            style: const TextStyle(
                              fontSize: 22,
                              fontWeight: FontWeight.bold,
                              color: Colors.greenAccent,
                            ),
                          ),
                          ElevatedButton(
                            style: ElevatedButton.styleFrom(
                              backgroundColor: Colors.deepPurple,
                              foregroundColor: Colors.white,
                              padding: const EdgeInsets.symmetric(horizontal: 24, vertical: 12),
                            ),
                            onPressed: () => openCheckout(product['pay_url']),
                            child: const Text('Купить сейчас', style: TextStyle(fontSize: 16)),
                          ),
                        ],
                      ),
                      const Divider(height: 32),
                      const Text(
                        'Описание товара:',
                        style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold),
                      ),
                      const SizedBox(height: 8),
                      Text(
                        description,
                        style: const TextStyle(fontSize: 14, height: 1.4),
                      ),
                      if (reviews.isNotEmpty) ...[
                        const Divider(height: 32),
                        Text(
                          'Отзывы покупателей (${reviews.length}):',
                          style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold),
                        ),
                        const SizedBox(height: 8),
                        ...reviews.map((r) {
                          String info = '';
                          if (r is Map) {
                            info = r['info'] ?? r['text'] ?? r['comment'] ?? '';
                          } else {
                            info = r.toString();
                          }
                          return Card(
                            margin: const EdgeInsets.symmetric(vertical: 4),
                            child: Padding(
                              padding: const EdgeInsets.all(10.0),
                              child: Text(info.isEmpty ? 'Положительный отзыв' : info),
                            ),
                          );
                        }),
                      ],
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
