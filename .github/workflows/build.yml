name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Create fresh Flutter template
        run: |
          flutter create . --org com.digiseller.app --project-name digiseller_app

      - name: Overwrite pubspec.yaml with dependencies
        run: |
          cat << 'EOF' > pubspec.yaml
          name: digiseller_app
          description: Digiseller Affiliate App
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            http: ^1.2.0
            url_launcher: ^6.2.5

          flutter:
            uses-material-design: true
          EOF

      - name: Overwrite main.dart with Custom API Code
        run: |
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:http/http.dart' as http;
          import 'dart:convert';
          import 'package:url_launcher/url_launcher.dart';

          void main() {
            runApp(const DigisellerApp());
          }

          class DigisellerApp extends StatelessWidget {
            const DigisellerApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Партнёрский Маркет',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  primarySwatch: Colors.deepPurple,
                  useMaterial3: true,
                ),
                home: const CatalogPage(),
              );
            }
          }

          class CatalogPage extends StatefulWidget {
            const CatalogPage({super.key});

            @override
            State<CatalogPage> createState() => _CatalogPageState();
          }

          class _CatalogPageState extends State<CatalogPage> {
            final String apiUrl = 'http://grummer565.temp.swtest.ru/'; 

            List products = [];
            bool isLoading = true;

            @override
            void initState() {
              super.initState();
              loadData();
            }

            Future<void> loadData() async {
              setState(() => isLoading = true);
              try {
                final response = await http.get(Uri.parse(apiUrl));
                if (response.statusCode == 200) {
                  final data = json.decode(response.body);
                  setState(() {
                    products = data['products'] ?? [];
                    isLoading = false;
                  });
                } else {
                  setState(() => isLoading = false);
                }
              } catch (e) {
                setState(() => isLoading = false);
              }
            }

            Future<void> openCheckout(String payUrl) async {
              final url = Uri.parse(payUrl);
              if (await canLaunchUrl(url)) {
                await launchUrl(url, mode: LaunchMode.externalApplication);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Каталог товаров'),
                  backgroundColor: Colors.deepPurple,
                  foregroundColor: Colors.white,
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.refresh),
                      onPressed: loadData,
                    )
                  ],
                ),
                body: isLoading
                    ? const Center(child: CircularProgressIndicator())
                    : products.isEmpty
                        ? const Center(child: Text('Список товаров пуст'))
                        : ListView.builder(
                            itemCount: products.length,
                            itemBuilder: (context, index) {
                              final item = products[index];
                              return Card(
                                margin: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                                child: ListTile(
                                  title: Text(
                                    item['title'] ?? 'Без названия',
                                    style: const TextStyle(fontWeight: FontWeight.bold),
                                  ),
                                  subtitle: Text(
                                    'Категория: ${item['category']} | ${item['price']}',
                                    style: const TextStyle(color: Colors.green),
                                  ),
                                  trailing: ElevatedButton(
                                    style: ElevatedButton.styleFrom(
                                      backgroundColor: Colors.deepPurple,
                                      foregroundColor: Colors.white,
                                    ),
                                    onPressed: () => openCheckout(item['pay_url']),
                                    child: const Text('Купить'),
                                  ),
                                ),
                              );
                            },
                          ),
              );
            }
          }
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
