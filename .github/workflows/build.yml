name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Create fresh Flutter template
        run: |
          flutter create . --org com.digiseller.app --project-name digiseller_app

      - name: Overwrite pubspec.yaml with dependencies
        run: |
          cat << 'EOF' > pubspec.yaml
          name: digiseller_app
          description: Digiseller Affiliate App
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            http: ^1.2.0
            url_launcher: ^6.2.5

          flutter:
            uses-material-design: true
          EOF

      - name: Overwrite main.dart with Digiseller code
        run: |
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:http/http.dart' as http;
          import 'dart:convert';
          import 'package:url_launcher/url_launcher.dart';

          void main() {
            runApp(const DigisellerApp());
          }

          class DigisellerApp extends StatelessWidget {
            const DigisellerApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Digiseller Catalog',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  primarySwatch: Colors.deepPurple,
                  useMaterial3: true,
                ),
                home: const CatalogPage(),
              );
            }
          }

          class CatalogPage extends StatefulWidget {
            const CatalogPage({super.key});

            @override
            State<CatalogPage> createState() => _CatalogPageState();
          }

          class _CatalogPageState extends State<CatalogPage> {
            List products = [];
            bool isLoading = true;
            final TextEditingController _searchController = TextEditingController(text: 'steam');

            // Ваш партнёрский ID
            final int agentId = 1389780; 

            @override
            void initState() {
              super.initState();
              fetchProducts(_searchController.text);
            }

            Future<void> fetchProducts(String query) async {
              setState(() {
                isLoading = true;
              });

              final searchQuery = query.trim().isEmpty ? 'steam' : query.trim();

              try {
                final response = await http.get(
                  Uri.parse('https://api.digiseller.com/api/search?query=$searchQuery&rows=30&page=1'),
                  headers: {
                    'Accept': 'application/json',
                    'User-Agent': 'Mozilla/5.0 (Android Mobile)',
                  },
                );
                
                if (response.statusCode == 200) {
                  final data = json.decode(response.body);
                  List rawRows = [];

                  if (data is Map && data.containsKey('rows')) {
                    rawRows = data['rows'] ?? [];
                  } else if (data is List) {
                    rawRows = data;
                  } else if (data is Map && data.containsKey('product')) {
                    rawRows = data['product'] ?? [];
                  }

                  setState(() {
                    products = rawRows;
                    isLoading = false;
                  });
                } else {
                  setState(() {
                    products = [];
                    isLoading = false;
                  });
                }
              } catch (e) {
                setState(() {
                  products = [];
                  isLoading = false;
                });
              }
            }

            Future<void> openCheckout(dynamic productId) async {
              if (productId == null) return;
              final url = Uri.parse('https://oplata.info/asp/pay.asp?id_d=$productId&ai=$agentId');
              if (await canLaunchUrl(url)) {
                await launchUrl(url, mode: LaunchMode.externalApplication);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Партнёрский магазин'),
                  backgroundColor: Colors.deepPurple,
                  foregroundColor: Colors.white,
                ),
                body: Column(
                  children: [
                    Padding(
                      padding: const EdgeInsets.all(12.0),
                      child: Row(
                        children: [
                          Expanded(
                            child: TextField(
                              controller: _searchController,
                              decoration: const InputDecoration(
                                labelText: 'Поиск товаров',
                                hintText: 'Например: steam, vpn, key',
                                border: OutlineInputBorder(),
                                contentPadding: EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                              ),
                              onSubmitted: (val) => fetchProducts(val),
                            ),
                          ),
                          const SizedBox(width: 8),
                          IconButton(
                            icon: const Icon(Icons.search),
                            onPressed: () => fetchProducts(_searchController.text),
                            color: Colors.deepPurple,
                          ),
                        ],
                      ),
                    ),
                    Expanded(
                      child: isLoading
                          ? const Center(child: CircularProgressIndicator())
                          : products.isEmpty
                              ? Center(
                                  child: Column(
                                    mainAxisAlignment: MainAxisAlignment.center,
                                    children: [
                                      const Text('Товары не найдены'),
                                      const SizedBox(height: 12),
                                      ElevatedButton(
                                        onPressed: () => fetchProducts('steam'),
                                        child: const Text('Сбросить поиск'),
                                      )
                                    ],
                                  ),
                                )
                              : ListView.builder(
                                  itemCount: products.length,
                                  itemBuilder: (context, index) {
                                    final item = products[index];
                                    final name = item['name'] ?? item['product_name'] ?? 'Без названия';
                                    final price = item['price_cnt'] ?? item['price_rub'] ?? item['price'] ?? '0';
                                    final currency = item['currency'] ?? 'RUB';
                                    final productId = item['id'] ?? item['product_id'];

                                    return Card(
                                      margin: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                                      child: ListTile(
                                        title: Text(
                                          name,
                                          maxLines: 2,
                                          overflow: TextOverflow.ellipsis,
                                        ),
                                        subtitle: Text(
                                          '$price $currency',
                                          style: const TextStyle(
                                            fontWeight: FontWeight.bold,
                                            color: Colors.green,
                                          ),
                                        ),
                                        trailing: ElevatedButton(
                                          style: ElevatedButton.styleFrom(
                                            backgroundColor: Colors.deepPurple,
                                            foregroundColor: Colors.white,
                                          ),
                                          onPressed: () => openCheckout(productId),
                                          child: const Text('Купить'),
                                        ),
                                      ),
                                    );
                                  },
                                ),
                    ),
                  ],
                ),
              );
            }
          }
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
